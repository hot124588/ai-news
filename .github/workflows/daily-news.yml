 yaml
    name: 🌤️ AI 新闻日报 — 每日自动更新

    on:
      schedule:
        - cron: '0 0 * * *'
      workflow_dispatch:
      push:
        branches: [main]

    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    jobs:
      fetch-and-build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-python@v5
            with:
              python-version: '3.11'
          - run: python scripts/fetch-news.py
          - uses: peaceiris/actions-gh-pages@v4
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              publish_dir: ./docs
              publish_branch: gh-pages
              force_orphan: true
              commit_message: '🤖 自动更新 AI 日报'
