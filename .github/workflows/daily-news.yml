name: AI新闻日报
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fetch-news.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
