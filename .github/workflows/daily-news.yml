name: AI新闻日报
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fetch-news.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/
          git diff --staged --quiet || git commit -m "auto update"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hot124588/ai-news.git HEAD:main
